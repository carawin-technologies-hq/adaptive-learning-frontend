
services:
  adaptive-frontend:
    image: ghcr.io/carawin-technologies-hq/adaptive-learning-frontend:${IMAGE_TAG:-latest}
    container_name: adaptive-frontend
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8306:3000"

    extra_hosts:
      - "host.docker.internal:host-gateway"

    networks:
      - adaptive-network

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  adaptive-network:
    external: true
    name: adaptive-network
