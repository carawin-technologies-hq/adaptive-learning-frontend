
name: adaptive-learning

services:
  adaptive-frontend:
    image: ghcr.io/carawin-technologies-hq/adaptive-learning-frontend:${IMAGE_TAG:-latest}
    container_name: adaptive-learning-frontend
    restart: unless-stopped
    init: true

    ports:
      - "127.0.0.1:8306:3000"

    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    networks:
      - adaptive-backend

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  adaptive-backend:
    external: true
    name: adaptive-learning-backend_default
