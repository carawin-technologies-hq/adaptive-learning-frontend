
name: Adaptive Learning Frontend CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: adaptive-frontend-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/carawin-technologies-hq/adaptive-learning-frontend

jobs:
  # --------------------------------------------------
  # 1. BUILD AND PUSH DOCKER IMAGE
  # --------------------------------------------------
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            API_PROXY_TARGET=${{ vars.API_PROXY_TARGET || 'http://backend:8000' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # --------------------------------------------------
  # 2. DEPLOY TO VPS
  # --------------------------------------------------
  deploy:
    name: Deploy to VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy using SSH
        uses: appleboy/ssh-action@v1.2.0

        env:
          GHCR_USERNAME: ${{ github.repository_owner }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          IMAGE_TAG: sha-${{ github.sha }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}

          envs: GHCR_USERNAME,GHCR_READ_TOKEN,IMAGE_TAG

          script: |
            set -e

            echo "Starting Adaptive Learning frontend deployment..."

            cd /root/adaptive-learning/frontend

            # Login to GitHub Container Registry
            echo "$GHCR_READ_TOKEN" | docker login ghcr.io \
              -u "$GHCR_USERNAME" \
              --password-stdin

            # Deploy the exact image built by this workflow
            export IMAGE_TAG="$IMAGE_TAG"

            docker compose config -q
            docker compose pull
            docker compose up -d --remove-orphans

            # Verify frontend and API proxy
            echo "Checking frontend and backend connectivity..."

            ATTEMPTS=30

            for i in $(seq 1 $ATTEMPTS); do
              if curl -fsS http://127.0.0.1:8306/api/v1/health; then
                echo ""
                echo "Frontend and backend API are responding successfully."
                break
              fi

              if [ "$i" -eq "$ATTEMPTS" ]; then
                echo "Deployment health check failed."

                docker compose ps
                docker compose logs --tail=100 adaptive-frontend

                exit 1
              fi

              echo "Waiting for application... ($i/$ATTEMPTS)"
              sleep 2
            done

            # Remove unused images
            docker image prune -f

            echo "Adaptive Learning frontend deployed successfully."
